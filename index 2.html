<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triangle Quest — Challenge Edition</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243c;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}header{background:#192f60;color:white;padding:26px 20px;text-align:center}header h1{margin:0;font-size:2rem}header p{margin:8px 0 0}.wrap{max-width:850px;margin:24px auto;padding:0 15px}.panel{background:white;border-radius:16px;padding:25px;box-shadow:0 6px 24px #152e5914;margin-bottom:18px}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}.bar{height:13px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:15px}.fill{height:100%;width:0;background:#2d7dca;transition:width .3s}.tag{color:#355ca4;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}.prompt{font-size:1.28rem;line-height:1.5;margin:16px 0}.hint{font-size:.95rem;color:#59677c}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice,button{border:2px solid #cad5e5;border-radius:10px;padding:13px;background:white;color:#17243c;font:inherit;cursor:pointer;text-align:left}.choice:hover{border-color:#3875c9;background:#f2f7ff}.choice.selected{border-color:#255eb1;background:#e9f2ff}.entry{width:100%;font-size:1.1rem;padding:13px;border:2px solid #cad5e5;border-radius:10px}button.primary{background:#235cb1;border-color:#235cb1;color:white;font-weight:700;text-align:center;margin-top:15px}button.primary:disabled{opacity:.5;cursor:not-allowed}.feedback{padding:13px;margin-top:16px;border-radius:9px;display:none;line-height:1.5}.feedback.good{display:block;background:#e4f7ed;color:#175c3b}.feedback.bad{display:block;background:#fff0e9;color:#8a3c18}.levelnav{display:flex;gap:6px;flex-wrap:wrap}.pill{border-radius:30px;padding:8px 12px;background:#e9eef7;color:#43536c;font-size:.8rem;font-weight:700}.pill.active{background:#d7e9ff;color:#174c94}.pill.done{background:#dff4e6;color:#17633d}.footer{font-size:.85rem;color:#58667c;text-align:center;padding-bottom:30px}@media(max-width:550px){.choices{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><header><h1>▲ Triangle Quest: Challenge Edition</h1><p>20 harder questions · 4 levels · Self-paced Geometry review</p></header><main class="wrap"><section class="panel"><div class="stats"><span id="count">Question 1 of 20</span><span id="score">Completed: 0/20</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="levelnav" id="levels" style="margin-top:16px"></div></section><section class="panel" id="game"><div class="tag" id="levelname"></div><div class="prompt" id="prompt"></div><div class="hint" id="instruction"></div><div id="answerarea" style="margin-top:15px"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="check" class="primary">Check Answer</button><button id="next" class="primary" style="display:none">Next Question →</button></section><div class="footer">Take your time. Correct answers unlock the next question. Refresh to start over.</div></main><script>
const questions=[
{l:1,q:'A triangle has side lengths 11, 11, and 18. Classify it by BOTH its sides and its angles.',options:['Isosceles acute','Isosceles obtuse','Scalene obtuse','Isosceles right'],a:1,why:'Two equal sides make it isosceles. Since 18² > 11² + 11², it is obtuse.'},
{l:1,q:'A triangle has side lengths 9, 12, and 15. Classify it by BOTH its sides and its angles.',options:['Scalene right','Isosceles right','Scalene acute','Scalene obtuse'],a:0,why:'All sides differ, and 9² + 12² = 15².'},
{l:1,q:'Which set of lengths makes an ACUTE scalene triangle?',options:['6, 8, 10','7, 8, 9','4, 6, 11','5, 5, 8'],a:1,why:'7² + 8² > 9², and all three sides differ.'},
{l:1,q:'Two angles of a triangle are 47° and 66°. Classify the triangle by BOTH angles and sides.',options:['Acute scalene','Obtuse scalene','Acute isosceles','Right scalene'],a:0,why:'The third angle is 67°, so all angles are acute and distinct.'},
{l:1,q:'A triangle has sides 8, 15, and 17. What is the measure of its largest angle?',options:['60°','90°','More than 90°','Cannot be determined'],a:1,why:'8² + 15² = 17², so it is a right triangle.'},
{l:2,q:'A triangle has angles (3x + 8)°, (5x − 4)°, and (4x + 20)°. Find x.',a:13,why:'3x + 8 + 5x − 4 + 4x + 20 = 180 → 12x + 24 = 180 → x = 13.'},
{l:2,q:'An isosceles triangle has vertex angle (4x + 10)° and each base angle (3x − 5)°. Find x.',a:18,why:'4x + 10 + 2(3x − 5) = 180 → 10x = 180 → x = 18.'},
{l:2,q:'An exterior angle measures (8x + 5)°. Its two remote interior angles measure (3x + 12)° and (2x + 35)°. Find x.',a:14,why:'8x + 5 = 3x + 12 + 2x + 35 → 3x = 42 → x = 14.'},
{l:2,q:'The angles of a triangle are (2x + 15)°, (3x + 5)°, and (4x − 20)°. Find the LARGEST angle in degrees.',a:75,why:'9x = 180 → x = 20. The angles are 55°, 65°, and 60°.' ,override:true},
{l:2,q:'An exterior angle is 125°. One remote interior angle is (3x + 7)° and the other is (2x + 18)°. Find x.',a:20,why:'(3x + 7) + (2x + 18) = 125 → 5x = 100 → x = 20.'},
{l:3,q:'An isosceles triangle has equal sides (4x + 3) cm and (7x − 18) cm. Its base is (3x + 5) cm. Find the PERIMETER in cm.',a:82,why:'4x + 3 = 7x − 18 → x = 7. Sides are 31, 31, and 26; perimeter = 88.',fix:88},
{l:3,q:'A triangle has sides (2x + 7), (4x − 3), and (3x + 5). Its perimeter is 90. Find x.',a:9,why:'2x + 7 + 4x − 3 + 3x + 5 = 90 → 9x + 9 = 90 → x = 9.'},
{l:3,q:'The sides of an equilateral triangle are (5x − 8) cm and (3x + 10) cm. Find its perimeter in cm.',a:111,why:'5x − 8 = 3x + 10 → x = 9. Each side is 37 cm; perimeter is 111 cm.'},
{l:3,q:'A triangle has sides 2x + 1, x + 8, and 17. If x = 6, what is its perimeter?',a:44,why:'The sides are 13, 14, and 17, totaling 44.'},
{l:3,q:'An isosceles triangle has a perimeter of 70 cm and base of 18 cm. What is the length of EACH equal side?',a:26,why:'(70 − 18) ÷ 2 = 26 cm.'},
{l:4,q:'Two sides of a triangle are 9 and 16. Which integer could NOT be the third side?',options:['8','12','24','10'],a:2,why:'The third side must be greater than 7 and less than 25. Wait: 24 is valid. This question is corrected below.'},
{l:4,q:'The angles of a triangle are in the ratio 2:3:7. What is its largest angle in degrees?',a:105,why:'12 parts = 180°, so each part = 15°. Largest angle = 7 × 15 = 105°.'},
{l:4,q:'The exterior angle of a triangle is 142°. One remote interior angle is twice the other. Find the SMALLER remote interior angle, to the nearest hundredth.',a:47.33,tol:.01,why:'Let the smaller be x: x + 2x = 142 → x = 47.33° (rounded).'},
{l:4,q:'A triangle has side lengths 7, 10, and x, where x is an INTEGER. How many possible values of x make a valid triangle?',a:13,why:'3 < x < 17, so x can be any integer from 4 through 16 (13 values).'},
{l:4,q:'The smallest angle of a triangle is x°. The second is (2x + 10)° and the largest is (3x + 20)°. Find the largest angle.',a:95,why:'x + 2x + 10 + 3x + 20 = 180 → x = 25; largest = 95°.'}
];
questions[8].a=65;questions[8].why='9x = 180 → x = 20. The angles are 55°, 65°, and 60°, so the largest is 65°.';questions[10].a=88;questions[15]={l:4,q:'Two sides of a triangle are 9 and 16. Which integer could NOT be the third side?',options:['8','12','25','10'],a:2,why:'Triangle inequality requires 7 < third side < 25. A side of 25 is too long.'};
let i=0,correct=0,selected=null,locked=false;const el=id=>document.getElementById(id);
function render(){const q=questions[i];selected=null;locked=false;el('count').textContent=`Question ${i+1} of ${questions.length}`;el('score').textContent=`Completed: ${correct}/${questions.length}`;el('fill').style.width=`${correct/questions.length*100}%`;el('levels').innerHTML=[1,2,3,4].map(n=>`<span class="pill ${n<q.l?'done':n===q.l?'active':''}">Level ${n}: ${['','Classification','Angle Algebra','Side Algebra','Challenge'][n]}</span>`).join('');el('levelname').textContent=`Level ${q.l} · Question ${i%5+1} of 5`;el('prompt').textContent=q.q;el('instruction').textContent=q.options?'Choose the best answer.':'Enter a number only (no units or degree symbol).';el('answerarea').innerHTML='';if(q.options){const box=document.createElement('div');box.className='choices';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{if(locked)return;selected=j;box.querySelectorAll('button').forEach((x,k)=>x.classList.toggle('selected',k===j))};box.append(b)});el('answerarea').append(box)}else{let inp=document.createElement('input');inp.className='entry';inp.id='number';inp.type='number';inp.step='any';inp.placeholder='Your answer';inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!locked)check()});el('answerarea').append(inp)}el('feedback').style.display='none';el('feedback').className='feedback';el('check').style.display='inline-block';el('next').style.display='none';el('next').textContent=i===questions.length-1?'See Results →':'Next Question →'}
function check(){if(locked)return;const q=questions[i];let val=q.options?selected:Number(el('number').value);if(q.options&&val===null||!q.options&&el('number').value.trim()===''){el('feedback').className='feedback bad';el('feedback').textContent='Enter or select an answer first.';return}const ok=q.options?val===q.a:Math.abs(val-q.a)<=(q.tol??.0001);el('feedback').className='feedback '+(ok?'good':'bad');el('feedback').textContent=ok?'✓ Correct! '+q.why:'Not quite. Check your work and try again.';if(ok){locked=true;correct++;el('score').textContent=`Completed: ${correct}/${questions.length}`;el('fill').style.width=`${correct/questions.length*100}%`;el('check').style.display='none';el('next').style.display='inline-block';if(q.options)el('answerarea').querySelectorAll('button').forEach(b=>b.disabled=true)}}
el('check').onclick=check;el('next').onclick=()=>{i++;if(i===questions.length){el('game').innerHTML='<h2>🏆 Challenge Complete!</h2><p>You correctly solved all 20 challenge questions. Great persistence!</p><button class="primary" onclick="location.reload()">Play Again</button>';el('count').textContent='All 20 questions complete';el('levels').querySelectorAll('.pill').forEach(x=>x.className='pill done')}else render()};render();
</script></body></html>
